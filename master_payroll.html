<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Master Payroll Karyawan</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
    font-family:Segoe UI;
    background:#eef2f7;
    padding:20px;
}
.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}
button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.preview{background:#3b82f6;color:white;}
.save{background:#10b981;color:white;}
table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}
th,td{
    border:1px solid #ddd;
    padding:8px;
}
th{background:#334155;color:white;}
.loading{color:blue;display:none;}
</style>
</head>

<body>

<div class="card">
<h2>Master Payroll</h2>

<input type="file" id="fileInput">
<button class="preview" onclick="preview()">Preview</button>
<button class="save" onclick="save()">Save</button>

<p id="loading" class="loading">⏳ Processing...</p>

<table>
<thead>
<tr>
<th>Nopeg</th>
<th>NIK</th>
<th>NPWP</th>
<th>Nama</th>
<th>JK</th>
<th>Alamat</th>
<th>Status Pajak</th>
<th>TMT</th>
<th>Project</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<script>
const supabase = window.supabase.createClient(
"https://https://crrebdiiwhcxnawppdyh.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNycmViZGlpd2hjeG5hd3BwZHloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNTA5NzcsImV4cCI6MjA5MjkyNjk3N30.uk9RtagnitOFY9NvsGulkIgsOoSXaiCcNxtXrjljp3A"
);

let uploadData = [];

/* ================= FORMAT DATE ================= */
function formatDate(value){
    if(!value) return null;

    if(typeof value === 'number'){
        const d = new Date((value-25569)*86400*1000);
        return d.toISOString().split('T')[0];
    }

    const d = new Date(value);
    if(isNaN(d)) return null;

    return d.toISOString().split('T')[0];
}

/* ================= PREVIEW ================= */
function preview(){
    const file = document.getElementById("fileInput").files[0];
    if(!file) return alert("Pilih file dulu");

    const reader = new FileReader();
    reader.onload = function(e){
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(sheet);

        uploadData = data.map(r => ({
            nopeg: r.Nopeg || r.NOPEG || '',
            nik: r.NIK || '',
            npwp: r.NPWP || '',
            nama: r.Nama || r.NAMA || '',
            jenis_kelamin: r["Jenis Kelamin"] || '',
            alamat: r.Alamat || '',
            status_pajak: r["Status Pajak"] || '',
            tmt: formatDate(r.TMT),
            project: r.Project || ''
        }));

        render();
    };

    reader.readAsArrayBuffer(file);
}

/* ================= SAVE ================= */
async function save(){
    if(uploadData.length === 0){
        alert("Tidak ada data");
        return;
    }

    document.getElementById("loading").style.display = "block";

    try{
        for(let chunk of chunkArray(uploadData, 500)){
            const { error } = await supabase
                .from("master_payroll")
                .insert(chunk);

            if(error){
                console.error(error);
                alert("ERROR: " + error.message);
                return;
            }
        }

        alert("✅ Berhasil simpan");
    }catch(err){
        console.error(err);
        alert("ERROR BESAR: " + err.message);
    }

    document.getElementById("loading").style.display = "none";
}

/* ================= TABLE ================= */
function render(){
    let html = "";
    uploadData.forEach(d=>{
        html += `
        <tr>
            <td>${d.nopeg}</td>
            <td>${d.nik}</td>
            <td>${d.npwp}</td>
            <td>${d.nama}</td>
            <td>${d.jenis_kelamin}</td>
            <td>${d.alamat}</td>
            <td>${d.status_pajak}</td>
            <td>${d.tmt || ''}</td>
            <td>${d.project}</td>
        </tr>`;
    });

    document.getElementById("table").innerHTML = html;
}

/* ================= CHUNK ================= */
function chunkArray(arr,size){
    return Array.from({length:Math.ceil(arr.length/size)},
        (_,i)=>arr.slice(i*size,i*size+size)
    );
}
</script>

</body>
</html>
